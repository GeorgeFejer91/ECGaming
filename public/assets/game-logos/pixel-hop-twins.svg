      <stop stop-color="#102a43"/>
      <stop offset="1" stop-color="#07131f"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#69d4de" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="720" height="360" rx="24" fill="url(#night)"/>
