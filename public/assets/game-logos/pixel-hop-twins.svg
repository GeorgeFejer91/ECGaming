  <path d="M0 294h720v66H0z" fill="#153b3d"/>
  <path d="M0 274h720v24H0z" fill="#d66c2e"/>
  <path d="M0 274h720" stroke="#f4b55d" stroke-width="7" stroke-dasharray="32 18"/>
  <g shape-rendering="crispEdges">
