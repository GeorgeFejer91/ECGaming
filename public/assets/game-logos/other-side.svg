<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Breathing Through to the Other Side</title>
  <desc id="desc">A tiny moth silhouette drifts inside a dark tunnel toward a warm light at the far end.</desc>
  <defs>
    <radialGradient id="glow" cx="74%" cy="42%" r="60%">
      <stop stop-color="#fffbe6" stop-opacity=".95"/>
      <stop offset=".22" stop-color="#eee5ae" stop-opacity=".5"/>
      <stop offset=".5" stop-color="#8d875e" stop-opacity=".18"/>
      <stop offset="1" stop-color="#030305" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tunnelClip">
