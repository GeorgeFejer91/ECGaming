    <circle cx="526" cy="180" r="34" fill="none" stroke="#1a1820" stroke-width="6"/>
  </g>
  <rect width="720" height="360" rx="24" fill="url(#glow)"/>
  <circle cx="538" cy="180" r="9" fill="#fffbe6"/>
  <circle cx="538" cy="180" r="22" fill="#fff6b0" opacity=".25"/>
  <circle cx="538" cy="180" r="46" fill="none" stroke="#f3e7a8" stroke-width="2" stroke-dasharray="8 18" opacity=".55" transform="rotate(-20 538 180)"/>
  <g fill="#020204">
    <path d="M404 170c-8-9-19-7-20 1-1 8 8 15 18 16-9 4-11 12-6 16 5 5 15-1 17-13z"/>
    <path d="M412 170c8-9 19-7 20 1 1 8-8 15-18 16 9 4 11 12 6 16-5 5-15-1-17-13z"/>
