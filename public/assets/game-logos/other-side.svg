  </g>
  <text x="42" y="70" fill="#c8bf8d" font-family="Georgia,serif" font-size="18" font-weight="700" letter-spacing="5">ECG + BREATH EDITION</text>
  <text x="42" y="160" fill="#e6e3d5" font-family="Georgia,serif" font-size="60" letter-spacing="6">THE OTHER</text>
  <text x="42" y="212" fill="#c8bf8d" font-family="Georgia,serif" font-size="60" letter-spacing="6">SIDE</text>
  <text x="46" y="252" fill="#8d8b80" font-family="Georgia,serif" font-size="18" letter-spacing="4">BREATHING THROUGH TO THE OTHER SIDE</text>
  <text x="380" y="320" fill="#7df4cf" font-family="Georgia,serif" font-size="14" letter-spacing="3">HOLD YOUR BREATH · THE LIGHT DRAWS NEARER</text>
