[package]
name = "breath-mirror-native"
version = "0.1.0"
description = "Low-latency native breath sonification for ECGames"
authors = ["ECGames"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "breath_mirror_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cpal = "0.18.2"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
