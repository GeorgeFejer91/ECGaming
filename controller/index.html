<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#263d3a" />
    <title>Phone controller · EC Gaming</title>
  </head>
  <body>
    <main class="controller">
      <h1 class="sr-only">Flight yoke</h1>
      <img id="steering-yoke" alt="Aircraft yoke surface with grips at both ends" width="1000" height="500" draggable="false" />
      <div id="tilt-pad" class="tilt-pad" role="group" aria-label="Airplane steering yoke"></div>
      <span class="yoke-guide left">LEFT HAND</span>
      <span class="yoke-guide right">RIGHT HAND</span>
      <div class="yoke-hub">
        <span class="yoke-top" data-fit-text data-fit-min="10" data-fit-max="16">↑ TOP</span>
        <p id="connection-status" role="status">Scan a flight QR code.</p>
        <p class="rotate-phone" role="note">↻ Hold your phone sideways</p>
        <section id="setup" aria-label="Pair your phone">
          <p>Scan a fresh QR code on your flight screen.</p>
        </section>
        <section id="controls" aria-label="Flight controls" hidden>
          <div class="controller-actions"><button id="centre" type="button" disabled>Centre</button><button id="input-mode" type="button" disabled>Enable tilt</button></div>
          <div id="yoke-polar" class="yoke-polar"></div>
          <div id="polar-status"></div>
          <p id="input-status" role="status">Hold the phone comfortably, then tap Centre.</p>
          <p id="confirmed">Waiting for the flight screen.</p>
          <div class="yoke-utilities"><button id="fullscreen" type="button" aria-label="Full screen" title="Full screen" hidden>⛶</button><button id="disconnect" type="button" hidden>Disconnect</button></div>
          <p id="wake-status" class="sr-only"></p>
        </section>
      </div>
    </main>
    <script type="module" src="/src/phone-tilt/controller.ts"></script>
  </body>
</html>
